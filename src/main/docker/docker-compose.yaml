services:
  postgres:
    image: postgres:17-alpine
    container_name: reisebus-postgres-dev
    environment:
      POSTGRES_DB: reisebus_dev
      POSTGRES_USER: reisebus
      POSTGRES_PASSWORD: reisebus
    ports:
      - "5432:5432"
    volumes:
      - reisebus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reisebus"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: reisebus-keycloak-dev
    command: [ "start-dev", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  reisebus-postgres-data:

